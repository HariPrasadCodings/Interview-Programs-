# ================================================================
# Product Service - CQRS Configuration
# ================================================================
# This service demonstrates the CQRS pattern:
#   - Write model: H2 (relational, via JPA)
#   - Read model:  MongoDB (document store, denormalised)
#   - Event bus:   Kafka (bridges write -> read)
# ================================================================

server:
  port: 8082

spring:
  application:
    name: product-service

  # ======================== Write Model (H2 / JPA) ========================
  # H2 is used as the write-side database. In production this would
  # typically be MySQL or PostgreSQL.
  datasource:
    url: jdbc:h2:mem:product-write-db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    # Prevent Spring Boot from auto-configuring JPA to use MongoDB
    database-platform: org.hibernate.dialect.H2Dialect

  # Enable H2 console for development debugging
  h2:
    console:
      enabled: true
      path: /h2-console

  # ======================== Read Model (MongoDB) ========================
  # MongoDB serves the read side. The denormalised ProductReadModel
  # collection is maintained by ProductEventHandler via Kafka events.
  data:
    mongodb:
      host: localhost
      port: 27017
      database: product-read-db

  # ======================== Kafka ========================
  # Kafka bridges the write and read models. The write side publishes
  # product domain events; the read side consumes and projects them.
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: product-service-read-model
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# ======================== Eureka Client ========================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# ======================== Actuator ========================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ======================== Logging ========================
logging:
  level:
    com.interview.microservices.product: DEBUG
    org.springframework.kafka: INFO
    org.springframework.data.mongodb: DEBUG
