# ================================================================
# SHARED CONFIGURATION - Applied to ALL microservices
# ================================================================
# This file is served to every microservice that connects to the
# Config Server. It contains common defaults such as:
#   - Eureka client registration settings
#   - Actuator management endpoints
#   - Common logging configuration
#
# Service-specific files (e.g., order-service.yml) override these
# values when a service requests its own configuration.
# ================================================================

# --- Eureka Client Configuration (Service Registry) ---
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    # Lease renewal interval (heartbeat) - how often the service
    # sends a heartbeat to Eureka to indicate it is still alive.
    lease-renewal-interval-in-seconds: 10
    # Lease expiration duration - how long Eureka waits before
    # evicting a service that has stopped sending heartbeats.
    lease-expiration-duration-in-seconds: 30

# --- Actuator Management Endpoints ---
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, refresh, circuitbreakers
  endpoint:
    health:
      show-details: always

# --- Common Logging ---
logging:
  level:
    root: INFO
    com.interview.microservices: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# --- Resilience4j Defaults (Circuit Breaker) ---
resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
