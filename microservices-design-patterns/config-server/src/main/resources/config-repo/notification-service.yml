# ================================================================
# NOTIFICATION SERVICE - Configuration
# ================================================================
# Sends notifications (email, SMS, push) to users, demonstrates:
#   - Async Messaging (Kafka consumer - event-driven)
#   - Decoupled communication (does not expose REST APIs to
#     other services; purely reactive to domain events)
# ================================================================

server:
  port: 8085

spring:
  application:
    name: notification-service

  # H2 in-memory database (for storing notification logs)
  datasource:
    url: jdbc:h2:mem:notificationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # Kafka consumer configuration (primarily a consumer service)
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  # Mail configuration (simulated - use MailHog or similar in dev)
  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# --- Notification Service Properties ---
notification:
  # Kafka topics this service listens to
  topics:
    order-placed: order-placed
    order-completed: order-completed
    order-cancelled: order-cancelled
    payment-completed: payment-completed
    payment-failed: payment-failed
  # Email templates
  email:
    from: noreply@ecommerce-demo.com
    subject-prefix: "[E-Commerce] "
