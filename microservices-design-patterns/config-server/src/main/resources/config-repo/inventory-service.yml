# ================================================================
# INVENTORY SERVICE - Configuration
# ================================================================
# Manages product stock levels, demonstrates:
#   - Database per Service pattern
#   - Saga pattern (reserve/release stock in distributed tx)
#   - Async Messaging (Kafka events for stock updates)
# ================================================================

server:
  port: 8084

spring:
  application:
    name: inventory-service

  # H2 in-memory database (Database per Service pattern)
  datasource:
    url: jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # Kafka configuration for inventory events
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: inventory-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

# --- Inventory Service Properties ---
inventory:
  # Low stock threshold for triggering alerts/notifications
  low-stock-threshold: 10
  # Kafka topics for saga communication
  topics:
    stock-reserved: stock-reserved
    stock-released: stock-released
    stock-insufficient: stock-insufficient
