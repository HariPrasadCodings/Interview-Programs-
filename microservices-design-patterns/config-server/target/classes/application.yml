# ================================================================
# CONFIG SERVER - Application Configuration
# ================================================================
# This is the Config Server's OWN configuration (not what it serves
# to clients). It defines:
#   - The server port (8888 is the Spring Cloud Config convention)
#   - The native profile for classpath-based config storage
#   - Actuator endpoints for health monitoring
# ================================================================

server:
  port: 8888

spring:
  application:
    name: config-server

  # Activate the "native" profile so Config Server reads configuration
  # files from the local classpath instead of a remote Git repository.
  # In production, you would switch to a Git backend for versioning.
  profiles:
    active: native

  cloud:
    config:
      server:
        # Native (filesystem/classpath) backend configuration.
        # The search-locations property tells Config Server where to
        # find the configuration files for each microservice.
        native:
          search-locations: classpath:/config-repo

        # Git backend (commented out - use in production):
        # git:
        #   uri: https://github.com/your-org/config-repo
        #   default-label: main
        #   clone-on-start: true

# Actuator endpoints for monitoring and management
management:
  endpoints:
    web:
      exposure:
        include: health, info, env, refresh
  endpoint:
    health:
      show-details: always

# Logging configuration
logging:
  level:
    org.springframework.cloud.config: DEBUG
