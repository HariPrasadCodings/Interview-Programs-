# ================================================================
# SAGA ORCHESTRATOR - Application Configuration
# ================================================================
# Demonstrates the Saga Pattern (Orchestration + Choreography)
# for managing distributed transactions across microservices.
# ================================================================

server:
  port: 8086

spring:
  application:
    name: saga-orchestrator

  # ==================== H2 In-Memory Database ====================
  # Saga instance state is persisted in H2 for tracking and recovery.
  # In production, use a durable database (PostgreSQL, MySQL).
  datasource:
    url: jdbc:h2:mem:sagadb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  # H2 Console - accessible at http://localhost:8086/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console

  # ==================== Kafka Configuration ====================
  # Used by the choreography-based saga for event-driven communication.
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: saga-choreography-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# ==================== Eureka Client Configuration ====================
# Registers with Eureka for service discovery. Feign clients use
# service names (order-service, inventory-service, payment-service)
# to locate target services without hardcoded URLs.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# ==================== Actuator ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ==================== Logging ====================
logging:
  level:
    com.interview.microservices.saga: DEBUG
    org.springframework.kafka: INFO
