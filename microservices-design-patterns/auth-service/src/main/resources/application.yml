server:
  port: 9000

spring:
  application:
    name: auth-service

  # ===== H2 In-Memory Database =====
  datasource:
    url: jdbc:h2:mem:authdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

# ===== JWT Configuration =====
jwt:
  # Base64-encoded 256-bit secret (replace in production with a secure value)
  secret: bXktc3VwZXItc2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24tMjU2LWJpdHM=
  # Token expiration in milliseconds (1 hour)
  expiration: 3600000

# ===== Eureka Client =====
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# ===== Actuator =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
