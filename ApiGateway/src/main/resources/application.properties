spring.application.name=ApiGateway

server.port = 8090
eureka.instance.client.serverUrl.defaultZone=http://localhost:8761/eureka/
management.endpoints.web.exposure.include=*

spring.cloud.gateway.discover.locator.enabled = true
spring.cloud.gateway.discover.locator.lower-case-sensitive = true

## Routes for Department Service
spring.cloud.gateway.server.webmvc.routes[0].id=DepartmentService
spring.cloud.gateway.server.webmvc.routes[0].uri = lb://DepartmentService
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=path=/api/v1/departments/**

## Routes for Employee Service
spring.cloud.gateway.server.webmvc.routes[1].id=EmployeeService
spring.cloud.gateway.server.webmvc.routes[1].uri = lb://EmployeeService
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=path=/api/v1/employees/**